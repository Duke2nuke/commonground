services:
  - type: web
    name: commonground
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
